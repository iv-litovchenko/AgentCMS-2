# Каталог переменных окружения по приложениям. Значения — var/starter/env.yaml (Стартер).
# В процессе PHP действуют env из Docker / apps/cms/.env; реестр описывает и документирует их.

apps:
  cms:
    label: CMS (основное приложение)
    description: Symfony apps/cms, контейнер docker-compose service cms
    variables:
      - key: CMS_SITE_TITLE
        label: CMS_SITE_TITLE
        description: 'Заголовок сайта (в .env значение с пробелами — в кавычках: "Agent CMS")'
        default: 'Agent CMS'
        sensitive: false
      - key: APP_ENV
        label: APP_ENV
        description: Режим Symfony (dev, prod)
        default: dev
        sensitive: false
      - key: APP_DEBUG
        label: APP_DEBUG
        description: Отладка Symfony (0 или 1)
        default: '1'
        sensitive: false
      - key: APP_SECRET
        label: APP_SECRET
        description: Секрет сессий и CSRF
        default: ''
        sensitive: true
      - key: DATABASE_URL
        label: DATABASE_URL
        description: PostgreSQL DSN
        default: 'postgresql://agentcms:agentcms@db:5432/agentcms?serverVersion=16&charset=utf8'
        sensitive: true
      - key: REDIS_URL
        label: REDIS_URL
        description: Redis DSN для кеша
        default: 'redis://redis:6379'
        sensitive: false
      - key: DEFAULT_URI
        label: DEFAULT_URI
        description: Базовый URL для CLI и генерации ссылок
        default: 'https://localhost:8443'
        sensitive: false
      - key: WORKSPACES_DIR
        label: WORKSPACES_DIR
        description: Каталог хранилищ на диске
        default: '/var/www/workspaces'
        sensitive: false
      - key: APP_HOST_PLATFORM
        label: APP_HOST_PLATFORM
        description: Хост для отчёта Стартера (mac, linux, windows)
        default: ''
        sensitive: false
      - key: PUBLIC_BASE_DOMAIN
        label: PUBLIC_BASE_DOMAIN
        description: Базовый домен для поддоменов сервисов
        default: localhost
        sensitive: false
      - key: PUBLIC_HTTP_PORT
        label: PUBLIC_HTTP_PORT
        description: Порт HTTP proxy
        default: '8080'
        sensitive: false
      - key: PUBLIC_HTTPS_PORT
        label: PUBLIC_HTTPS_PORT
        description: Порт HTTPS proxy
        default: '8443'
        sensitive: false
      - key: PUBLIC_PREFERRED_SCHEME
        label: PUBLIC_PREFERRED_SCHEME
        description: Протокол ссылок UI (localhost и прод) — обычно https
        default: https
        sensitive: false
      - key: REDIRECT_HTTP_TO_HTTPS
        label: REDIRECT_HTTP_TO_HTTPS
        description: '301 с HTTP на HTTPS (0/1). Локально: :8080 → :8443 при портах по умолчанию'
        default: '1'
        sensitive: false
      - key: PROJECT_README_PATH
        label: PROJECT_README_PATH
        description: Путь к README для документации
        default: ''
        sensitive: false

packages:
  demo_block:
    label: Demo block
    description: packages/demo-block (Composer agent-cms/page-demo-block)
    variables: []

services:
  qwenpaw:
    label: QwenPaw
    description: docker-compose service qwenpaw, поддомен qwenpaw.{PUBLIC_BASE_DOMAIN}
    variables:
      - key: QWENPAW_STUB_MESSAGE
        label: QWENPAW_STUB_MESSAGE
        description: Заготовка — текст на stub-странице сервиса (compose env, когда появится)
        default: 'QwenPaw stub'
        sensitive: false
