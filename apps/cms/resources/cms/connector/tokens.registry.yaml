# MCP-токены. URL подключения — PUBLIC_* (Стартер). Значения токенов — var/connector/tokens.yaml

mcp_path: /mcp/

tokens:
  items:
    - id: cursor_mcp
      label: Cursor MCP
      description: Токен доступа к MCP (заготовка — Bearer или заголовок по настройке сервера)
    - id: agent_api
      label: Agent API
      description: Токен для REST API CMS (Sanctum, когда будет включён)
