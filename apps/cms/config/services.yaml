parameters:
    app.version: '0.0.1'
    app.workspaces_dir: '%env(default:app_workspaces_dir_default:WORKSPACES_DIR)%'
    app_workspaces_dir_default: '%kernel.project_dir%/../../workspaces'
    app.ui_menu_config: '%kernel.project_dir%/resources/cms/ui/menu.yaml'
    app.starter_packages_registry: '%kernel.project_dir%/resources/cms/starter/packages.yaml'
    app.starter_toggles_file: '%kernel.project_dir%/var/starter/toggles.yaml'
    app.cms_log_file: '%kernel.logs_dir%/cms.log'
    app.starter_log_max_lines: 80
    app.starter_log_max_bytes: 65536
    app.project_readme_default: '%kernel.project_dir%/../../README.md'
    app.project_readme: '%env(default:app.project_readme_default:PROJECT_README_PATH)%'
    app.public_base_domain: '%env(default:app_public_base_domain_default:PUBLIC_BASE_DOMAIN)%'
    app_public_base_domain_default: 'localhost'
    app.public_http_port: '%env(default:app_public_http_port_default:PUBLIC_HTTP_PORT)%'
    app_public_http_port_default: '8080'
    app.public_https_port: '%env(default:app_public_https_port_default:PUBLIC_HTTPS_PORT)%'
    app_public_https_port_default: '8443'
    app.public_preferred_scheme: '%env(default:app_public_preferred_scheme_default:PUBLIC_PREFERRED_SCHEME)%'
    app_public_preferred_scheme_default: 'http'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\WorkspaceService:
        arguments:
            $workspacesDir: '%app.workspaces_dir%'

    App\Service\UiMenuService:
        arguments:
            $uiMenuConfigPath: '%app.ui_menu_config%'
            $publicBaseDomain: '%app.public_base_domain%'
            $publicHttpPort: '%app.public_http_port%'
            $publicHttpsPort: '%app.public_https_port%'
            $publicPreferredScheme: '%app.public_preferred_scheme%'

    App\Service\StarterEnvironmentService:
        arguments:
            $appVersion: '%app.version%'

    App\Service\StarterToggleService:
        arguments:
            $packagesRegistryPath: '%app.starter_packages_registry%'
            $menuConfigPath: '%app.ui_menu_config%'
            $togglesFilePath: '%app.starter_toggles_file%'

    App\Service\CmsFileLogger:
        arguments:
            $logFilePath: '%app.cms_log_file%'

    App\Service\StarterLogJournalService:
        arguments:
            $logDirectory: '%kernel.logs_dir%'
            $maxLines: '%app.starter_log_max_lines%'
            $maxBytesPerFile: '%app.starter_log_max_bytes%'

    App\Service\ProjectReadmeService:
        arguments:
            $readmePath: '%app.project_readme%'
