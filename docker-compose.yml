# Agent CMS — общая заготовка (Mac / Linux / Windows + Docker Desktop)
# Запуск: docker compose up --build
# Dev (код с диска): cp docker-compose.override.example.yml docker-compose.override.yml
# CMS:     http://localhost:8080/
# HTTPS:   https://localhost:8443/ (self-signed, SAN *.localhost)
# QwenPaw: http://qwenpaw.localhost:8080/
# Prod:    *.sitename.ru — см. notes/tls-and-subdomains.md
# MCP stub: http://localhost:8080/mcp/
# API stub: http://localhost:8080/api/

name: agent-cms

services:
  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - cms
      - mcp
      - api
      - qwenpaw
    networks:
      - agentcms

  cms:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://agentcms:agentcms@db:5432/agentcms?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      DEFAULT_URI: https://localhost:8443
      CMS_SITE_TITLE: ${CMS_SITE_TITLE:-Agent CMS}
      WORKSPACES_DIR: /var/www/workspaces
      APP_HOST_PLATFORM: ${APP_HOST_PLATFORM:-}
      PUBLIC_BASE_DOMAIN: ${PUBLIC_BASE_DOMAIN:-localhost}
      PUBLIC_HTTP_PORT: ${PUBLIC_HTTP_PORT:-8080}
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-8443}
      PUBLIC_PREFERRED_SCHEME: ${PUBLIC_PREFERRED_SCHEME:-https}
      REDIRECT_HTTP_TO_HTTPS: ${REDIRECT_HTTP_TO_HTTPS:-1}
    volumes:
      - ./workspaces:/var/www/workspaces
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - agentcms

  mcp:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    networks:
      - agentcms

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    networks:
      - agentcms

  qwenpaw:
    build:
      context: .
      dockerfile: docker/qwenpaw/Dockerfile
    networks:
      - agentcms

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentcms
      POSTGRES_PASSWORD: agentcms
      POSTGRES_DB: agentcms
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agentcms

  redis:
    image: redis:7-alpine
    networks:
      - agentcms

volumes:
  pgdata:

networks:
  agentcms:
    driver: bridge
