# Windows (Docker Desktop, WSL2 backend рекомендуется):
# docker compose -f docker-compose.yml -f compose/docker-compose.windows.yml up --build

services:
  cms:
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
    volumes:
      - ../apps/cms:/var/www/cms
      - ../shared/php:/var/www/shared/php
      - cms_vendor:/var/www/cms/vendor

volumes:
  cms_vendor:
